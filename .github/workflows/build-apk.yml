name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java version verification passed ($JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK."
            echo "Searching app/build/outputs/apk directory for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK exists but is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: Target file does not have .apk extension."; exit 1 ;;
          esac

          echo "APK successfully verified at: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TMP_DIR="/tmp/apk-release-asset"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TMP_DIR/app-debug.apk"
          cp "$SOURCE_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_APK."
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK ($(ls -lh "$DEST_APK" | awk '{print $5}'))"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset missing or empty at $ASSET_PATH."
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk (found $ASSET_NAME)."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### Automated Debug APK Build
- **Builder:** GitHub Actions
#- **Run Number:** ${{ github.run_number }}
#- **Run Attempt:** ${{ github.run_attempt }}
#- **Commit SHA:** ${{ github.sha }}
#
> **Notice:** This APK is intended for testing and development purposes. It is signed with a temporary debug keystore and is not a Play Store production release."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "GITHUB RELEASE PUBLISHED SUCCESSFULLY"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Direct APK URL: $DIRECT_URL"
            echo "APK Filename: app-debug.apk"
            echo "=================================================="
            gh release view "$RELEASE_TAG" || true

            echo "## 📱 DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[$DIRECT_URL]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Direct APK Asset: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "Actions backup artifact \`app-debug-apk\` remains available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::GitHub Release creation step failed or was skipped."
            echo "If the APK build succeeded, the GitHub Actions artifact 'app-debug-apk' remains available for download on the workflow run summary page."
            echo "## ⚠️ GitHub Release Notice" >> $GITHUB_STEP_SUMMARY
            echo "Release publishing failed or was skipped, but the Actions backup artifact \`app-debug-apk\` remains available for download." >> $GITHUB_STEP_SUMMARY
          fi
